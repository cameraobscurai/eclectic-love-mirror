name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates + a real production build. Split from the browser job so a
  # type error or an OOM in the build fails in ~5 minutes instead of after
  # Playwright. Peak RSS measured locally at ~4.2GB, hence the explicit heap:
  # GitHub-hosted runners have 7GB, but the Node default is lower.
  typecheck-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=6144"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`: a bun release should never silently change what
      # CI validates.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsgo --noEmit

      # Lint is intentionally NOT a gate yet: `bun run lint` currently reports
      # ~12.9k problems repo-wide (almost all prettier formatting). Turning it
      # on today would fail every PR and teach people to ignore CI. Format the
      # tree in a dedicated pass, then add `bun run lint` here.

      - name: Production build
        run: bun run build

  fit-and-console-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Standing engineering rules (docs/DECISIONS.md). Fast, no browser, no
      # network — runs before anything expensive so a rule break fails in
      # seconds rather than after a 20-minute Playwright pass.
      - name: Engineering rules gate
        run: bun run rules:check

      # Frame Studio engine fixtures (measure / place / verify, canonicalizer
      # stability, anchor carve-out). Pure, no browser, no network.
      - name: Unit tests
        run: bun run test


      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          bun run dev > /tmp/dev-server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "dev server never became ready"; cat /tmp/dev-server.log; exit 1

      # Fit / floor-anchoring regression gate. Compares measured silhouettes
      # against scripts/audit/tile-fit-baseline.json. To intentionally retune a
      # category, run `bun run fit:baseline` locally and commit the new baseline.
      - name: Fit + floor-anchor regression gate
        run: bun run fit:check

      # Includes layout-visual.spec.ts — QuickView + PDP screenshot
      # regression. Re-baseline intentionally with `bun run visual:baseline`.
      - name: Console + network health + visual regression
        run: bunx playwright test

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/

      - name: Upload dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: /tmp/dev-server.log
